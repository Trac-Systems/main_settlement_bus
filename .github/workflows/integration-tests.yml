name: MSB-Integration-Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: ${{ matrix.test-script }} (${{ matrix.node-version }})
    runs-on: [self-hosted, Linux, X64]

    strategy:
      fail-fast: false
      matrix:
        node-version: [lts/*]
        test-script: [test:integration, test:integration:consensus]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Install bare
        if: matrix.test-script == 'test:integration:consensus'
        run: npm i -g bare
      - name: Run integration tests
        run: npm run ${{ matrix.test-script }}
